name: Update README
on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python 3.14
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync
      - name: Regenerate README tools table
        run: uv run python scripts/update_readme.py
      - name: Open PR if the README changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: README.md
          branch: auto/update-readme
          delete-branch: true
          commit-message: Update README tools table from OpenAPI spec
          title: Update README tools table from OpenAPI spec
          body: Automated daily refresh of the Available Tools table from the production OpenAPI spec.

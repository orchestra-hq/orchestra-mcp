name: Publish MCP Server
run-name: Publish orchestra-mcp to the MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for mcp-publisher login github-oidc
  contents: read

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # server.json is the single source of truth for the version, so a tag that
      # disagrees with it is a mistake - fail here rather than publish the wrong
      # version to the registry.
      - name: Check version
        run: |
          version="$(jq -er '.version' server.json)"
          echo "server.json version: $version"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag v${tag_version} does not match server.json version ${version}." \
                   "Bump server.json first, then tag to match."
              exit 1
            fi
          fi

      # Pinned and checksum-verified rather than piping `releases/latest` straight
      # into a shell: this job holds id-token: write, and mcp-publisher uses it to
      # mint a credential for the whole io.github.orchestra-hq/* namespace, so a
      # swapped binary would be an org-wide compromise. The asset is linux_amd64
      # because ubuntu-latest runners are x86_64. Bump the version and digest
      # together - the digest comes from registry_<version>_checksums.txt on the
      # release.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server
        run: ./mcp-publisher publish

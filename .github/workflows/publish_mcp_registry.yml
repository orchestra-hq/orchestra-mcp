name: Publish MCP Server
run-name: Publish orchestra-mcp to the MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for mcp-publisher login github-oidc
  contents: read

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # server.json is the single source of truth for the version, so a tag that
      # disagrees with it is a mistake - fail here rather than publish the wrong
      # version to the registry.
      - name: Check version
        run: |
          version="$(jq -er '.version' server.json)"
          echo "server.json version: $version"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag v${tag_version} does not match server.json version ${version}." \
                   "Bump server.json first, then tag to match."
              exit 1
            fi
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server
        run: ./mcp-publisher publish
